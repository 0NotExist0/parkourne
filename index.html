<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Parkour</title>
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: system-ui, Arial, sans-serif; color: #fff; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 5; font-size: 16px; text-shadow: 0 1px 3px #000; pointer-events: none; line-height: 1.6; }
  #mirino { position: fixed; top: 50%; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; z-index: 5; pointer-events: none; }
  #mirino::before, #mirino::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #mirino::before { left: 0; right: 0; top: 10px; height: 2px; }
  #mirino::after { top: 0; bottom: 0; left: 10px; width: 2px; }
  #inizio { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: rgba(10, 16, 30, 0.88); text-align: center; padding: 20px; }
  #inizio[hidden] { display: none; }
  #inizio h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); }
  #inizio p { margin: 0; max-width: 520px; line-height: 1.6; font-size: 16px; }
  #gioca { padding: 14px 34px; font-size: 20px; border: 0; border-radius: 10px; background: #33aa55; color: #fff; cursor: pointer; }
  #gioca:hover { background: #3cc464; }

  /* Controlli touch (android) */
  #controlli-touch { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; pointer-events: none; height: 130px; }
  #joystick { position: absolute; bottom: 12px; left: 18px; width: 100px; height: 100px; pointer-events: auto; }
  #joystick-base { position: absolute; inset: 0; background: rgba(255,255,255,0.12); border-radius: 50%; border: 2px solid rgba(255,255,255,0.28); }
  #joystick-stick { position: absolute; width: 42px; height: 42px; background: rgba(255,255,255,0.5); border-radius: 50%; left: 29px; top: 29px; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  #btn-salta { position: absolute; bottom: 18px; right: 18px; width: 66px; height: 66px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.18); color: #fff; font-size: 13px; font-weight: 700; pointer-events: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
  #btn-salta:active { background: rgba(255,255,255,0.35); }
</style>
</head>
<body>

<div id="mirino"></div>

<div id="hud">
  <div>Parkour</div>
  <div>W A S D = muoviti  •  Spazio = salta</div>
</div>

<div id="controlli-touch" hidden>
  <div id="joystick">
    <div id="joystick-base"></div>
    <div id="joystick-stick"></div>
  </div>
  <button id="btn-salta">Salta</button>
</div>

<script type="module" src="gioco.js"></script>
</body>
</html>
